<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trivia Feller — vista previa</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#2a2a2a;font-family:system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:520px;min-height:100vh;background:#e8323a;color:#fff;padding:20px 20px 28px;display:flex;flex-direction:column;align-items:center;gap:16px;position:relative;overflow:hidden}
.logo{font:italic 700 46px Georgia,serif}
h1.t{font-size:36px;line-height:1.1;text-align:center;margin:0;font-weight:800}
.photo{width:100%;flex:1;min-height:240px;border-radius:20px;background:#c9252d;display:grid;place-items:center;text-align:center;padding:16px;font-size:16px;gap:10px}
.btn{width:100%;border:0;border-radius:16px;padding:20px;font-size:28px;font-weight:800;background:#fff;color:#e8323a;cursor:pointer}
.btn.alt{background:#b3161e;color:#fff}
.card{width:100%;background:#fff;color:#222;border-radius:20px;padding:22px;display:grid;gap:16px}
.lbl{font-size:22px;font-weight:700;color:#e8323a;display:grid;gap:6px}
.in{width:100%;font-size:26px;padding:14px 16px;border:3px solid #f0b6b9;border-radius:12px}
.meta{display:flex;justify-content:space-between;width:100%;font-size:20px;font-weight:700}
.bar{height:10px;background:#ffffff55;border-radius:99px;width:100%;overflow:hidden}.bar>div{height:100%;background:#fff;transition:width 1s linear}
.q{background:#fff;border-radius:20px;padding:20px;width:100%;display:grid;gap:12px}
.vis{font-size:68px;text-align:center;line-height:1}.qt{font-size:30px;line-height:1.2;font-weight:800;color:#b3161e;text-align:center;margin:0}
.opt{width:100%;text-align:left;border:3px solid #e8323a;background:#fff;color:#222;border-radius:16px;padding:18px 20px;font-size:26px;font-weight:700;cursor:pointer;min-height:76px}
.opt.ok{background:#1f9d55;border-color:#1f9d55;color:#fff}.opt.bad{background:#555;border-color:#555;color:#fff}
.fb{display:grid;place-items:center;gap:12px;width:100%}
.good,.miss{display:flex;align-items:center;gap:14px;font-weight:900;background:#fff;padding:14px 28px;border-radius:22px;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.good{font-size:56px;color:#1f9d55}.miss{font-size:50px;color:#e8323a}
.jump{animation:jump .7s ease-in-out infinite}.sway{animation:sway 1.2s ease-in-out infinite}
.exp{background:#ffffff22;border-radius:16px;padding:14px 18px;font-size:22px;line-height:1.3;text-align:center;width:100%}.exp b{color:#ffe27a}
.deco{display:flex;justify-content:center;align-items:flex-end;gap:8px}
.conf{position:absolute;inset:0;pointer-events:none}.conf i{position:absolute;top:-20px;width:10px;height:15px;animation:fall linear infinite}
.egg{position:absolute;left:50%;top:-80px;z-index:3;animation:drop 1.4s ease-in forwards}
.splat{position:absolute;left:50%;top:55%;font-size:90px;z-index:3;opacity:0;animation:splat 2.4s ease-out forwards}
.final{text-align:center;display:grid;gap:12px;width:100%;justify-items:center}.final h2{font-size:60px;margin:0;font-weight:900}.final p{font-size:28px;margin:0}
.frase{font-size:28px;font-weight:800;line-height:1.25}
.modes{display:flex;gap:10px;width:100%}.modes button{flex:1;padding:12px;border-radius:12px;border:2px solid #fff;background:transparent;color:#fff;font-size:18px;font-weight:700;cursor:pointer}.modes button.on{background:#fff;color:#e8323a}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes jump{50%{transform:translateY(-22px) rotate(-8deg)}}@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) translateY(4px)}}
@keyframes fall{to{transform:translateY(120vh) rotate(540deg)}}
@keyframes drop{to{transform:translate(-50%,55vh) rotate(25deg)}}
@keyframes splat{0%,60%{opacity:0;transform:translateX(-50%) scale(.3)}65%{opacity:1;transform:translateX(-50%) scale(1.2)}100%{opacity:0;transform:translateX(-50%) translateY(35vh)}}
</style></head><body><div id="app"></div>
<script>
const QS=[
{t:'¿Cuánto pesa una gallina ponedora?',v:'🐔',o:['1,8 a 2,2 kg','4 a 5 kg','Menos de 1 kg'],c:0,e:'Una gallina ponedora pesa entre 1,8 y 2,2 kg.'},
{t:'¿Cuándo conviene comer huevo?',v:'🍳',o:['Solo en el desayuno','A cualquier hora del día'],c:1,e:'El huevo se puede incorporar en cualquier momento del día.'},
{t:'Un huevo con la cáscara rota, ¿se puede consumir?',v:'🥚',o:['Verdadero','Falso'],c:1,e:'Falso: una cáscara rota deja pasar bacterias. Hay que descartarlo.'},
{t:'¿Dónde se guarda mejor el huevo?',v:'🧊',o:['En la heladera','Al sol'],c:0,e:'En la heladera, en su maple, se conserva mejor.'},
{t:'El huevo es una buena fuente de proteínas.',v:'💪',o:['Verdadero','Falso'],c:0,e:'Verdadero: es un superalimento, con proteínas de alta calidad.'}];
const MODES={facil:{n:'Fácil',need:3},dificil:{n:'Difícil',need:4}};
const SECS=15;
const chick=(s=70,sad)=>`<svg width="${s}" height="${s}" viewBox="0 0 100 100"><ellipse cx="50" cy="60" rx="30" ry="28" fill="#ffd23f"/><circle cx="50" cy="38" r="22" fill="#ffd23f"/><path d="M46 44l4 7 4-7z" fill="#ff8a1f"/><circle cx="41" cy="36" r="3.2" fill="#222"/><circle cx="59" cy="36" r="3.2" fill="#222"/>${sad?'<path d="M36 28l9 3M64 28l-9 3" stroke="#222" stroke-width="2.5" stroke-linecap="round"/><path d="M60 41q2 6 0 9" stroke="#59b8ff" stroke-width="3" fill="none" stroke-linecap="round"/>':'<ellipse cx="34" cy="46" rx="4" ry="2.5" fill="#ff9d7a" opacity=".7"/>'}<path d="M44 88v6M56 88v6" stroke="#ff8a1f" stroke-width="3" stroke-linecap="round"/></svg>`;
const egg=(s=34,c='#fff',f)=>`<svg width="${s}" height="${s*1.25}" viewBox="0 0 40 50"><ellipse cx="20" cy="28" rx="16" ry="20" fill="${c}" stroke="#00000022" stroke-width="1.5"/>${f?'<circle cx="14" cy="26" r="2" fill="#333"/><circle cx="26" cy="26" r="2" fill="#333"/><path d="M15 34q5 4 10 0" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>':''}</svg>`;
const COL=['#fff','#f6b73c','#fff','#8fd3c8','#fff','#f4a6b8'];
const deco=n=>`<div class="deco">${Array.from({length:n},(_,i)=>i%2?egg(34,COL[i%6],i%3==0):chick(54)).join('')}</div>`;
const conf=()=>`<div class="conf">${Array.from({length:40},(_,i)=>`<i style="left:${i*37%100}%;background:${['#ffd23f','#fff','#59b8ff','#7be495','#ff8fb1'][i%5]};animation-delay:${(i%10)*.12}s;animation-duration:${2+(i%5)*.4}s"></i>`).join('')}</div>`;
const S={step:'cover',mode:'facil',i:0,ok:0,pick:null,left:SECS,name:'',loc:''};let tm;
const $=document.getElementById('app'),logo='<div class="logo">Feller</div>';
function stop(){clearInterval(tm)}
function go(s){S.step=s;render()}
function answer(k){stop();S.pick=k;if(k===QS[S.i].c)S.ok++;go('fb')}
function startQ(){S.left=SECS;go('q');stop();tm=setInterval(()=>{S.left--;if(S.left<=0){answer(null)}else{document.getElementById('tl').textContent=S.left+'s';document.getElementById('tb').style.width=S.left/SECS*100+'%'}},1000)}
function render(){const q=QS[S.i];let h=logo;
if(S.step=='cover')h+=`<div class="modes">${Object.keys(MODES).map(m=>`<button class="${S.mode==m?'on':''}" onclick="S.mode='${m}';render()">${MODES[m].n}: ${MODES[m].need}/5</button>`).join('')}</div><h1 class="t">¿Cuánto sabés del huevo?</h1><div class="photo">${deco(5)}<span>(acá va la foto de la persona sosteniendo un huevo)</span></div><button class="btn" onclick="go('form')">¡Jugá ahora!</button>`;
if(S.step=='form')h+=`<form class="card" onsubmit="event.preventDefault();S.name=n.value;S.loc=l.value;startQ()"><div class="lbl">PARA COMPLETAR</div><label class="lbl">Nombre<input id="n" class="in" required></label><label class="lbl">Localidad<input id="l" class="in" required></label><button class="btn alt">Comenzar</button></form>`;
if(S.step=='q')h+=`<div class="meta"><span>Pregunta ${S.i+1} de 5</span><span id="tl">${S.left}s</span></div><div class="bar"><div id="tb" style="width:${S.left/SECS*100}%"></div></div><div class="q"><div class="vis">${q.v}</div><h2 class="qt">${q.t}</h2></div>${q.o.map((o,k)=>`<button class="opt" onclick="answer(${k})">${o}</button>`).join('')}${deco(6)}`;
if(S.step=='fb'){const right=S.pick===q.c;h+=`<div class="meta"><span>Pregunta ${S.i+1} de 5</span><span>${S.ok} correctas</span></div><div class="q"><h2 class="qt" style="font-size:24px">${q.t}</h2></div>${q.o.map((o,k)=>`<div class="opt ${k==q.c?'ok':k==S.pick?'bad':''}" style="min-height:0;padding:12px 18px;font-size:22px">${o}</div>`).join('')}<div class="fb">${right?conf()+`<div class="good"><span class="jump">${chick(100)}</span>¡Correcto!</div>`:`<div class="egg">${egg(80,'#fff',1)}</div><div class="splat">🍳</div><div class="miss"><span class="sway">${chick(100,1)}</span>¡Casi!</div><div class="exp">${S.pick===null?'Se acabó el tiempo. ':''}La respuesta correcta es <b>${q.o[q.c]}</b>. ${q.e}</div>`}</div><button class="btn" onclick="if(S.i+1>=5)go('end');else{S.i++;startQ()}">${S.i+1>=5?'Ver resultado':'Siguiente'}</button>`}
if(S.step=='end'){const w=S.ok>=MODES[S.mode].need;h+=`<div class="final">${w?conf()+`<h2>¡GANASTE!</h2><p>Te llevás un premio</p>${deco(7)}`:`<h2>${S.ok}/5</h2><p>respuestas correctas</p><p><b>¡Gracias por jugar!</b></p>`}<div class="frase">Desde el origen,<br>potenciamos el valor<br>de un superalimento</div>${logo}<button class="btn" onclick="Object.assign(S,{i:0,ok:0,pick:null});go('cover')">Nuevo jugador</button></div>`}
$.innerHTML=h}
render();
</script></body></html>
